<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Citizenship / ITAR Flag</title>
    <style>
      body {
        font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
        margin: 0;
        padding: 14px 16px;
        width: 260px;
        color: #222;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 10px;
        color: #555;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }
      .swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: rgba(220, 30, 30, 0.7);
        margin-right: 4px;
      }
      ul {
        margin: 8px 0 0;
        padding-left: 18px;
        color: #666;
        font-size: 12px;
      }
      li { margin-bottom: 2px; }
    </style>
  </head>
  <body>
    <h1><span class="swatch"></span>Citizenship / ITAR Flag</h1>
    <p>Tints the current tab red when the page mentions any of the below.</p>
    <label><input type="checkbox" id="toggle" /> Enabled</label>
    <ul>
      <li>ITAR / export-controlled</li>
      <li>US Government / security clearance</li>
      <li>US citizenship required / US persons only</li>
      <li>No F-1/J-1/CPT/OPT / no visa sponsorship</li>
    </ul>
    <script src="popup.js"></script>
  </body>
</html>
